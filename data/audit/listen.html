0323-0900-PLENARY-12-pl_20090323-21-22-59_5", "src": "../cleaned/audio/20090323-0900-PLENARY-12-pl_20090323-21-22-59_5.flac", "dur": 10.08, "text": "Wpływ Unii Afrykańskiej na polepszenie sytuacji ekonomicznej jest tak znikomy, że w praktyce jest to fasadowa organizacja bez żadnego wpływu na codzienne rozwiązywanie problemów."}, {"id": "20090323-0900-PLENARY-12-pl_20090323-21-22-59_6", "src": "../cleaned/audio/20090323-0900-PLENARY-12-pl_20090323-21-22-59_6.flac", "dur": 4.94, "text": "Organizacja polityków, którzy, korzystając z niej, uczestniczą w światowym życiu politycznym."}, {"id": "20090324-0900-PLENARY-3-pl_20090324-11-40-07_6", "src": "../cleaned/audio/20090324-0900-PLENARY-3-pl_20090324-11-40-07_6.flac", "dur": 9.26, "text": "Cieszę się, że pani komisarz podkreśliła potrzebę redukcji różnic w poziomie rozwoju oraz znaczenie synergii w realizacji polityk unijnych."}, {"id": "20090325-0900-PLENARY-11-pl_20090325-19-30-30_13", "src": "../cleaned/audio/20090325-0900-PLENARY-11-pl_20090325-19-30-30_13.flac", "dur": 14.919, "text": "Przeciwstawiamy się temu, żeby manipulować tą pamięcią, żeby uwłaczano tej pamięci w ten sposób, że staje się ona dzisiaj drogą do walki ideologicznej, do walki partyjnej w europejskim systemie politycznym."}, {"id": "20090325-0900-PLENARY-11-pl_20090325-19-43-54_10", "src": "../cleaned/audio/20090325-0900-PLENARY-11-pl_20090325-19-43-54_10.flac", "dur": 15.44, "text": "Jest przy tym charakterystyczne, że o ile europejska prawica nie relatywizuje dzisiaj zbrodni nazistowskich, europejska lewica relatywizuje zbrodnie komunistyczne, co widać wyraźnie ze stosunków socjalistów i komunistów do projektu rezolucji w tej sprawie, jaką dzisiaj negocjowaliśmy."}, {"id": "20090325-0900-PLENARY-8-pl_20090325-16-04-24_2", "src": "../cleaned/audio/20090325-0900-PLENARY-8-pl_20090325-16-04-24_2.flac", "dur": 20.058, "text": "Niepokojem bowiem napawają mnie dziwne, zacieśniające się stosunki między Stanami Zjednoczonymi a Rosją kosztem umów międzynarodowych z niektórymi krajami europejskimi, jak Polską czy Czechami, choćby w kwestii budowy tarczy antyrakietowej, w której Stany Zjednoczone wycofują się z"}, {"id": "20090325-0900-PLENARY-8-pl_20090325-16-06-01_2", "src": "../cleaned/audio/20090325-0900-PLENARY-8-pl_20090325-16-06-01_2.flac", "dur": 4.98, "text": "Ja chciałem powrócić do innej refleksji i nią się podzielić."}, {"id": "20090326-0900-PLENARY-10-pl_20090326-15-27-37_1", "src": "../cleaned/audio/20090326-0900-PLENARY-10-pl_20090326-15-27-37_1.flac", "dur": 8.079, "text": "Piękno kultury bierze się z jej różnorodności regionalnej, lokalnej, zmieniającej się wraz z rozwojem społeczeństw."}, {"id": "20090326-0900-PLENARY-10-pl_20090326-15-35-34_1", "src": "../cleaned/audio/20090326-0900-PLENARY-10-pl_20090326-15-35-34_1.flac", "dur": 4.919, "text": "Człowiek musi jeść, przemieszczać się i schować od zimna czy deszczu."}, {"id": "20090326-0900-PLENARY-3-pl_20090326-10-24-34_10", "src": "../cleaned/audio/20090326-0900-PLENARY-3-pl_20090326-10-24-34_10.flac", "dur": 9.04, "text": "To efekt błędnej polityki rolnej, która powoduje bankructwa gospodarstw rodzinnych i powiększa grono osób potrzebujących pomocy żywnościowej."}, {"id": "20090326-0900-PLENARY-3-pl_20090326-10-24-34_7", "src": "../cleaned/audio/20090326-0900-PLENARY-3-pl_20090326-10-24-34_7.flac", "dur": 4.88, "text": "Jest to program, który leczy skutki, ale nie likwiduje przyczyn."}, {"id": "20090422-0900-PLENARY-19-pl_20090422-22-29-38_9", "src": "../cleaned/audio/20090422-0900-PLENARY-19-pl_20090422-22-29-38_9.flac", "dur": 7.14, "text": "Potrzebne są rozwiązania modalne wykorzystujące różne środki transportu zbiorowego i zmniejszające zatłoczenie centrów miast."}, {"id": "20090422-0900-PLENARY-3-pl_20090422-10-19-57_12", "src": "../cleaned/audio/20090422-0900-PLENARY-3-pl_20090422-10-19-57_12.flac", "dur": 3.96, "text": "Podobno w oficjalnych komunikatach nie ma na ten temat ani słowa."}, {"id": "20090507-0900-PLENARY-5-pl_20090507-09-23-07_2", "src": "../cleaned/audio/20090507-0900-PLENARY-5-pl_20090507-09-23-07_2.flac", "dur": 11.779, "text": "Program MEDIA Mundus idzie dalej i stawia na obopólne korzyści wynikające z promocji i otwarcia rynków audiowizualnych, zarówno Unii Europejskiej, jak i państw trzecich."}, {"id": "20110705-0900-PLENARY-12-pl_20110705-21-06-47_3", "src": "../cleaned/audio/20110705-0900-PLENARY-12-pl_20110705-21-06-47_3.flac", "dur": 10.98, "text": "Ułatwi ona państwom członkowskim wymianę informacji dotyczących osób, które dopuściły się wykroczenia drogowego w państwie członkowskim innym od państwa rejestracji pojazdu."}, {"id": "20110705-0900-PLENARY-6-pl_20110705-14-27-39_5", "src": "../cleaned/audio/20110705-0900-PLENARY-6-pl_20110705-14-27-39_5.flac", "dur": 8.759, "text": "Ale produkcja związana z emisją dwutlenku węgla nadal jest intensywnie prowadzona w Chinach, w Indiach, w krajach Ameryki Południowej."}, {"id": "20110705-0900-PLENARY-8-pl_20110705-15-06-18_2", "src": "../cleaned/audio/20110705-0900-PLENARY-8-pl_20110705-15-06-18_2.flac", "dur": 7.539, "text": "Jest to jeden z najważniejszych tematów, którym będziemy się zajmować w ciągu najbliższych kilkudziesięciu miesięcy."}, {"id": "20110706-0900-PLENARY-3-pl_20110706-11-01-17_4", "src": "../cleaned/audio/20110706-0900-PLENARY-3-pl_20110706-11-01-17_4.flac", "dur": 22.037, "text": "Porozumienie to jest potrzebne także dla zdrowia i perspektywy wzrostu gospodarki europejskiej w dłuższym okresie, dla powrotu do normalnych warunków rynkowych o mniejszym stopniu niepewności, sprzyjających tak bardzo potrzebnym Europie inwestycjom. I wreszcie dobre ramy zarządzania gospodarczego, to także konieczny warunek dla dalszego rozszerzania strefy euro."}, {"id": "20110706-0900-PLENARY-4-pl_20110706-11-47-34_16", "src": "../cleaned/audio/20110706-0900-PLENARY-4-pl_20110706-11-47-34_16.flac", "dur": 19.16, "text": "Oczywiście ten wzrost gospodarczy musimy zapewnić głównie dzięki reformom strukturalnym i prywatyzacji, ale musimy mieć programy pomocy, które zapewniają nie tylko konsolidację finansów publicznych, ale także umożliwiają wzrost gospodarczy."}, {"id": "20110913-0900-PLENARY-12-pl_20110913-15-08-39_22", "src": "../cleaned/audio/20110913-0900-PLENARY-12-pl_20110913-15-08-39_22.flac", "dur": 12.52, "text": "Rozporządzenie wyraźnie definiuje pojęcie nadużyć oraz wprowadza zakaz nadużyć na hurtowym rynku energii elektrycznej i produktów pochodnych oraz na hurtowym rynku gazu ziemnego i produktów pochodnych."}, {"id": "20110913-0900-PLENARY-12-pl_20110913-15-08-39_24", "src": "../cleaned/audio/20110913-0900-PLENARY-12-pl_20110913-15-08-39_24.flac", "dur": 14.6, "text": "Przepisy sformułowano w taki sposób, aby zachować ich spójność z dyrektywą w sprawie nadużyć na rynku oraz dyrektywą w sprawie rynków instrumentów finansowych Rozporządzenie"}, {"id": "20110913-0900-PLENARY-12-pl_20110913-16-12-05_6", "src": "../cleaned/audio/20110913-0900-PLENARY-12-pl_20110913-16-12-05_6.flac", "dur": 13.959, "text": "W tym kontekście chciałbym odpowiedzieć na szereg wątpliwości, które zgłaszali na przykład poseł Goebbels, poseł Turmes, poseł Swoboda, Paksas i inni, dotyczące reżimu sankcji."}, {"id": "20110913-0900-PLENARY-13-pl_20110913-16-29-36_6", "src": "../cleaned/audio/20110913-0900-PLENARY-13-pl_20110913-16-29-36_6.flac", "dur": 11.8, "text": "Na początek chciałbym powiedzieć kilka słów na temat przygotowanego przez posłankę Evę Lichtenberger sprawozdania rocznego z kontroli stosowania prawa Unii Europejskiej."}, {"id": "20110913-0900-PLENARY-4-pl_20110913-09-44-34_17", "src": "../cleaned/audio/20110913-0900-PLENARY-4-pl_20110913-09-44-34_17.flac", "dur": 13.2, "text": "Obejmuje powołanie europejskich zespołów straży granicznej jako wspólnego zasobu do dyspozycji w trakcie wszystkich operacji Frontex, wcześniej określanych jako wspólne zespoły wsparcia i zespoły Rabit, tj."}, {"id": "20110913-0900-PLENARY-4-pl_20110913-09-44-34_31", "src": "../cleaned/audio/20110913-0900-PLENARY-4-pl_20110913-09-44-34_31.flac", "dur": 8.2, "text": "Pozwoli to na rozwój procesu wzmacniania polityki Unii Europejskiej w obszarze zarządzania granicami w najbliższych latach."}, {"id": "20110928-0900-PLENARY-7-pl_20110928-16-39-34_10", "src": "../cleaned/audio/20110928-0900-PLENARY-7-pl_20110928-16-39-34_10.flac", "dur": 11.48, "text": "Uważam, że aczkolwiek zrobiliśmy pewne istotne postępy, nie zrobiliśmy tego, co powinniśmy zrobić."}, {"id": "20110928-0900-PLENARY-7-pl_20110928-16-39-34_23", "src": "../cleaned/audio/20110928-0900-PLENARY-7-pl_20110928-16-39-34_23.flac", "dur": 16.42, "text": "Chciałbym bardzo serdecznie podziękować Parlamentowi za to, że myśli również o tym, przyjmując swój dokument, który jest dla nas wsparciem w naszych pracach."}, {"id": "20111026-0900-PLENARY-13-pl_20111026-15-12-35_2", "src": "../cleaned/audio/20111026-0900-PLENARY-13-pl_20111026-15-12-35_2.flac", "dur": 18.559, "text": "Polska prezydencja rozumie obawy wyrażone przez szanownych posłów, które odnoszą się do odroczenia ustanowienia wspólnego unijnego programu przesiedleń poprzez przyjęcie wniosku w sprawie zmiany decyzji ustanawiającej Europejski Fundusz na rzecz Uchodźców na lata"}, {"id": "20111026-0900-PLENARY-13-pl_20111026-15-42-17_2", "src": "../cleaned/audio/20111026-0900-PLENARY-13-pl_20111026-15-42-17_2.flac", "dur": 7.2, "text": "polityczną i praktyczną pomiędzy państwami członkowskimi, a także pomiędzy tymi państwami i państwami trzecimi."}, {"id": "20111115-0900-PLENARY-11-pl_20111115-18-27-12_14", "src": "../cleaned/audio/20111115-0900-PLENARY-11-pl_20111115-18-27-12_14.flac", "dur": 10.619, "text": "Sytuacja się zmieniła i widzimy, że są kraje, które mają w tej chwili różne możliwości redukcyjne, ale są też kraje, które potrzebują finansowania w zakresie adaptacji."}, {"id": "20111115-0900-PLENARY-13-pl_20111115-19-44-45_10", "src": "../cleaned/audio/20111115-0900-PLENARY-13-pl_20111115-19-44-45_10.flac", "dur": 12.24, "text": "W tym względzie z zadowoleniem przyjmujemy przedstawiony przez Komisję komunikat dotyczący zwiększenia wpływu unijnej polityki rozwoju i programu działań na rzecz zmian."}, {"id": "20111115-0900-PLENARY-13-pl_20111115-19-44-45_9", "src": "../cleaned/audio/20111115-0900-PLENARY-13-pl_20111115-19-44-45_9.flac", "dur": 12.199, "text": "Tym istotniejsze jest w tej sytuacji, aby nasi obywatele zrozumieli, dlaczego takie znaczenie ma polityka rozwojowa i powiązane z nią środki budżetowe."}, {"id": "20111116-0900-PLENARY-9-pl_20111116-17-01-22_18", "src": "../cleaned/audio/20111116-0900-PLENARY-9-pl_20111116-17-01-22_18.flac", "dur": 20.18, "text": "Oczywiście wiemy o tym, że nie wszystkie państwa członkowskie dokonały już implementacji pakietu musimy pamiętać, że jest to kilka obszernych dyrektyw, które wymagają głębokiej analizy, i te procesy implementacji mają się ku końcowi w każdym państwie członkowskim."}, {"id": "20120201-0900-PLENARY-13-pl_20120201-20-56-53_1", "src": "../cleaned/audio/20120201-0900-PLENARY-13-pl_20120201-20-56-53_1.flac", "dur": 9.16, "text": "Nie powinna ona wynikać z naszych lęków czy obaw przed pojawieniem się nowych potęg, lecz opierać się na współpracy i budowaniu wzajemnego zaufania."}, {"id": "20121023-0900-PLENARY-14-pl_20121023-19-46-43_5", "src": "../cleaned/audio/20121023-0900-PLENARY-14-pl_20121023-19-46-43_5.flac", "dur": 14.1, "text": "Niezbędne jest dalsze otwarcie rynku zamówień publicznych, osiągnięcie pełnej wzajemności i przejrzystości, a także zwiększanie szans przedsiębiorstw poprzez umożliwienie uzyskiwania zamówień publicznych na wszystkich szczeblach administracji według zasad krajowych."}, {"id": "20131010-0900-PLENARY-23-pl_20131010-15-59-28_4", "src": "../cleaned/audio/20131010-0900-PLENARY-23-pl_20131010-15-59-28_4.flac", "dur": 8.359, "text": "Władze Sudanu muszą respektować prawa kobiet i osób LGBT, wolność zgromadzeń, wyznania, słowa, prasy i internetu."}, {"id": "20131010-0900-PLENARY-23-pl_20131010-16-02-09_9", "src": "../cleaned/audio/20131010-0900-PLENARY-23-pl_20131010-16-02-09_9.flac", "dur": 2.76, "text": "Sudanu i Sudanu Południowego."}, {"id": "20131022-0900-PLENARY-19-pl_20131022-20-03-07_2", "src": "../cleaned/audio/20131022-0900-PLENARY-19-pl_20131022-20-03-07_2.flac", "dur": 2.88, "text": "Jakie mechanizmy powodują, że Europa się scala?"}, {"id": "20131024-0900-PLENARY-11-pl_20131024-12-31-47_1", "src": "../cleaned/audio/20131024-0900-PLENARY-11-pl_20131024-12-31-47_1.flac", "dur": 8.879, "text": "Zgadzam się z podejściem, że stosowanie działań odwetowych powinno być ostatecznością, co nie zmienia faktu, że należy takim instrumentem dysponować."}, {"id": "20140203-0900-PLENARY-16-pl_20140203-21-08-02_15", "src": "../cleaned/audio/20140203-0900-PLENARY-16-pl_20140203-21-08-02_15.flac", "dur": 15.44, "text": "Po raz kolejny także wskazuję na absolutnie kluczową kwestię szkolenia pracowników wymiaru sprawiedliwości zarówno w zakresie wiedzy o przepisach unijnych i istniejących instrumentach prawnych, jak i pod kątem znajomości języków obcych."}, {"id": "20140402-0900-PLENARY-15-pl_20140402-19-45-25_6", "src": "../cleaned/audio/20140402-0900-PLENARY-15-pl_20140402-19-45-25_6.flac", "dur": 17.28, "text": "Ale Wy już tak macie, trudno. Zwracam się do moich Kolegów socjalistów, z którymi wielokrotnie podejmowaliśmy ważne decyzje dotyczące Unii Europejskiej, dotyczące wartości europejskich i szerzenia ich poza Europą, w świecie."}, {"id": "20140915-0900-PLENARY-13-pl_20140915-17-16-55_19", "src": "../cleaned/audio/20140915-0900-PLENARY-13-pl_20140915-17-16-55_19.flac", "dur": 3.32, "text": "Czy zamierza Pan uzupełnić pierwszy zestaw działań?"}, {"id": "20140915-0900-PLENARY-13-pl_20140915-17-16-55_4", "src": "../cleaned/audio/20140915-0900-PLENARY-13-pl_20140915-17-16-55_4.flac", "dur": 7.02, "text": "W niektórych sektorach, takich jak owoce, warzywa, oraz ser i masło, dotknięta została ok."}, {"id": "20150908-0900-PLENARY-13-pl_20150908-18-21-49_0", "src": "../cleaned/audio/20150908-0900-PLENARY-13-pl_20150908-18-21-49_0.flac", "dur": 1.56, "text": "Pani Przewodnicząca!"}, {"id": "20151027-0900-PLENARY-16-pl_20151027-21-26-10_6", "src": "../cleaned/audio/20151027-0900-PLENARY-16-pl_20151027-21-26-10_6.flac", "dur": 4.68, "text": "Jak został przeprowadzony proces doboru członków zespołu pod względem merytorycznym?"}, {"id": "20151124-0900-PLENARY-14-pl_20151124-21-54-35_10", "src": "../cleaned/audio/20151124-0900-PLENARY-14-pl_20151124-21-54-35_10.flac", "dur": 5.2, "text": "ciepło technologiczne, czego nie można zrobić, gdy importuje się surowe wlewki stalowe."}, {"id": "20151216-0900-PLENARY-17-pl_20151216-21-00-20_3", "src": "../cleaned/audio/20151216-0900-PLENARY-17-pl_20151216-21-00-20_3.flac", "dur": 11.18, "text": "Nie chodzi tutaj tylko o to, by kontrolować te zezwolenia, które są wydawane, ale o to, by sprawdzać, gdzie rzeczywiście i w jakiej skali dociera broń."}, {"id": "20160913-0900-PLENARY-11-pl_20160913-15-45-05_4", "src": "../cleaned/audio/20160913-0900-PLENARY-11-pl_20160913-15-45-05_4.flac", "dur": 5.28, "text": "Otóż odpowiadam na wszystkie te pytania ręce precz od Polski!"}, {"id": "20170201-0900-PLENARY-15-pl_20170201-21-42-50_0", "src": "../cleaned/audio/20170201-0900-PLENARY-15-pl_20170201-21-42-50_0.flac", "dur": 15.418, "text": "Była znakomita okazja, by nowe rozporządzenie Parlamentu Europejskiego i Rady w sprawie zrównoważonego zarządzania zewnętrznymi flotami rybackimi wprowadziło jasne, równe i sprawiedliwe zasady funkcjonowania floty rybackiej unijnej i floty państw trzecich."}, {"id": "20170214-0900-PLENARY-19-pl_20170214-21-44-58_0", "src": "../cleaned/audio/20170214-0900-PLENARY-19-pl_20170214-21-44-58_0.flac", "dur": 16.458, "text": "Panie Przewodniczący! Doceniając wielkie znaczenie europejskiego semestru, jako unijnego kalendarza koordynacji polityki gospodarczej państw członkowskich Unii Europejskiej, należy wskazać, że w ostatecznym raporcie pojawiły się w mojej ocenie pewne kwestie problematyczne."}, {"id": "20170313-0900-PLENARY-11-pl_20170313-19-41-51_3", "src": "../cleaned/audio/20170313-0900-PLENARY-11-pl_20170313-19-41-51_3.flac", "dur": 17.32, "text": "Z tego, co wiem, pani minister Rafalska jest bardzo otwarta i z chęcią spotka się z odpowiednimi ministrami, nie tylko z Czech, ale również z innych państw, żeby pokazać, w jaki sposób w Polsce po wielu latach udało się doprowadzić do zmniejszenia tej luki płacowej."}, {"id": "20170314-0900-PLENARY-2-pl_20170314-09-30-49_3", "src": "../cleaned/audio/20170314-0900-PLENARY-2-pl_20170314-09-30-49_3.flac", "dur": 4.44, "text": "Propozycja Komisji od początku była nierealna, nie odpowiadała założonym celom."}, {"id": "20170404-0900-PLENARY-19-pl_20170404-20-26-29_22", "src": "../cleaned/audio/20170404-0900-PLENARY-19-pl_20170404-20-26-29_22.flac", "dur": 12.099, "text": "Inaczej mówiąc, przeznaczenie większych kwot na zadania w szczególności związane z nowymi wyzwaniami dotyczącymi kryzysu imigracyjnego i również zatrudniania młodych ludzi."}, {"id": "20170404-0900-PLENARY-19-pl_20170404-20-26-29_7", "src": "../cleaned/audio/20170404-0900-PLENARY-19-pl_20170404-20-26-29_7.flac", "dur": 11.5, "text": "Zaproponował pewien zakres tych zmian, które następnie były omawiane w Radzie i oczywiście bardzo dokładnie analizowane przez Komisję."}, {"id": "20170515-0900-PLENARY-10-pl_20170515-17-13-10_14", "src": "../cleaned/audio/20170515-0900-PLENARY-10-pl_20170515-17-13-10_14.flac", "dur": 7.64, "text": "Zwraca uwagę gwałtowny wzrost przypadków nieprawidłowości dotyczących wspólnej polityki rybołówstwa."}, {"id": "20170515-0900-PLENARY-10-pl_20170515-17-13-10_28", "src": "../cleaned/audio/20170515-0900-PLENARY-10-pl_20170515-17-13-10_28.flac", "dur": 11.86, "text": "Sprawozdanie zawiera również obszerne omówienie funkcjonowania OLAF, z uwzględnieniem osiąganych wyników, czasu prowadzenia postępowań oraz przygotowywanych analiz."}, {"id": "20170613-0900-PLENARY-14-pl_20170613-17-15-04_5", "src": "../cleaned/audio/20170613-0900-PLENARY-14-pl_20170613-17-15-04_5.flac", "dur": 7.9, "text": "i ścisłej współpracy z Europejskim Urzędem Bezpieczeństwa Żywności oraz Europejską Agencją Chemikaliów i innymi."}, {"id": "20170704-0900-PLENARY-21-pl_20170704-22-16-10_6", "src": "../cleaned/audio/20170704-0900-PLENARY-21-pl_20170704-22-16-10_6.flac", "dur": 20.86, "text": "Wielokrotnie gdy byliśmy z wizytą, chociażby jako komisja DROI w różnych państwach to nawet takie najogólniejsze odniesienia pozwalały nam pytać o te podstawowe zagadnienia z zakresu praw człowieka i dawały tytuł instytucjonalny, prawny, aby jednak uzależniać wykonywanie umowy od stanu przestrzegania praw człowieka."}, {"id": "20170704-0900-PLENARY-4-pl_20170704-11-22-15_3", "src": "../cleaned/audio/20170704-0900-PLENARY-4-pl_20170704-11-22-15_3.flac", "dur": 11.738, "text": "Nowy projekt przepisów, którego celem jest zwiększenie przejrzystości poprzez informowanie opinii publicznej o wysokości podatków płaconych przez korporacje międzynarodowe wraz z miejscem ich płacenia, ma temu zapobiec."}, {"id": "20170912-0900-PLENARY-5-pl_20170912-10-05-40_12", "src": "../cleaned/audio/20170912-0900-PLENARY-5-pl_20170912-10-05-40_12.flac", "dur": 3.58, "text": "Pierwszy raz osiągnęliśmy takie porozumienie."}, {"id": "20170912-0900-PLENARY-5-pl_20170912-10-05-40_14", "src": "../cleaned/audio/20170912-0900-PLENARY-5-pl_20170912-10-05-40_14.flac", "dur": 4.5, "text": "która pozostała łącznie z tymi korytarzami awaryjnymi."}, {"id": "20170912-0900-PLENARY-5-pl_20170912-10-19-55_9", "src": "../cleaned/audio/20170912-0900-PLENARY-5-pl_20170912-10-19-55_9.flac", "dur": 6.98, "text": "W duchu niniejszego rozporządzenia musimy zatem działać spójnie, aby skutecznie poradzić sobie z tym problemem."}, {"id": "20170913-0900-PLENARY-19-pl_20170913-20-58-24_5", "src": "../cleaned/audio/20170913-0900-PLENARY-19-pl_20170913-20-58-24_5.flac", "dur": 2.52, "text": "gatunków blokujących w połowach wielogatunkowych."}, {"id": "20171004-0900-PLENARY-7-pl_20171004-12-34-19_1", "src": "../cleaned/audio/20171004-0900-PLENARY-7-pl_20171004-12-34-19_1.flac", "dur": 7.178, "text": "Cieszę się, że ogranicza się ilość rozmaitych potencjalnych ingerencji do mniejszej ilości podmiotów."}, {"id": "20171025-0900-PLENARY-18-pl_20171025-15-40-09_3", "src": "../cleaned/audio/20171025-0900-PLENARY-18-pl_20171025-15-40-09_3.flac", "dur": 5.26, "text": "Nie ulega wątpliwości też, że presja migracyjna uległa znacznemu zmniejszeniu w ostatnim roku."}, {"id": "20171025-0900-PLENARY-20-pl_20171025-18-25-17_2", "src": "../cleaned/audio/20171025-0900-PLENARY-20-pl_20171025-18-25-17_2.flac", "dur": 16.278, "text": "Z jednej strony doceniamy fakt, że sekurytyzacja może zwiększyć wydajność i stabilność systemu finansowego oraz stworzyć dodatkowe źródła taniego finansowania dla MŚP, ale z drugiej strony system ten ma poważne wady."}, {"id": "20171113-0900-PLENARY-15-pl_20171113-20-44-29_2", "src": "../cleaned/audio/20171113-0900-PLENARY-15-pl_20171113-20-44-29_2.flac", "dur": 20.756, "text": "Miałbym w związku z tym pytanie Czy mogłaby Pani również przedstawić jakieś propozycje co moglibyśmy zrobić, jakie działania podjąć, aby uniemożliwić, aby ograniczyć tego typu działania, abyśmy byli wsparciem dla chrześcijan na świecie, aby nie byli poddawani tego typu bezwzględnym dyskryminującym działaniom?"}, {"id": "20171115-0900-PLENARY-17-pl_20171115-15-50-44_10", "src": "../cleaned/audio/20171115-0900-PLENARY-17-pl_20171115-15-50-44_10.flac", "dur": 3.98, "text": "Popatrzmy bowiem na Europę, jaka ona się staje dzisiaj."}, {"id": "20171115-0900-PLENARY-17-pl_20171115-15-50-44_15", "src": "../cleaned/audio/20171115-0900-PLENARY-17-pl_20171115-15-50-44_15.flac", "dur": 7.04, "text": "Komunizm więc ta idea komunistyczna tutaj święci swoje wielkie triumfy i trzeba o tym krzyczeć."}, {"id": "20171115-0900-PLENARY-4-pl_20171115-09-24-40_47", "src": "../cleaned/audio/20171115-0900-PLENARY-4-pl_20171115-09-24-40_47.flac", "dur": 8.88, "text": "smokiem. Komisja, niestety, ma ten niedobry zwyczaj, że po prostu ignoruje wszystkie odpowiedzi polskiego rządu i cały czas powtarza"}, {"id": "20171115-0900-PLENARY-4-pl_20171115-09-42-32_20", "src": "../cleaned/audio/20171115-0900-PLENARY-4-pl_20171115-09-42-32_20.flac", "dur": 4.26, "text": "Zajmijcie się własnymi państwami i przestańcie się tutaj kompromitować."}, {"id": "20171129-0900-PLENARY-12-pl_20171129-16-06-38_2", "src": "../cleaned/audio/20171129-0900-PLENARY-12-pl_20171129-16-06-38_2.flac", "dur": 11.838, "text": "Natomiast ja patrzę na to z niepokojem, bo to przypomina pacjenta, który bardzo się cieszy, widząc, jak w jego ciele pojawił się ogromny nowotwór, który bardzo szybko rośnie."}, {"id": "20171130-0900-PLENARY-5-pl_20171130-10-03-00_3", "src": "../cleaned/audio/20171130-0900-PLENARY-5-pl_20171130-10-03-00_3.flac", "dur": 17.738, "text": "rozwijanie asystentury, włączającej edukacji, zindywidualizowanego doradztwa oraz zatrudnienia wspomaganego, a także dostępnego otoczenia, towarów i usług, co podkreślała również Pani Komisarz."}, {"id": "20171130-0900-PLENARY-5-pl_20171130-10-07-47_3", "src": "../cleaned/audio/20171130-0900-PLENARY-5-pl_20171130-10-07-47_3.flac", "dur": 9.899, "text": "Byłoby tak pięknie i szlachetnie, gdyby świat osób niepełnosprawnych i świat ludzi zdrowych stał na jednym trwałym fundamencie i gdyby wzajemnie się wzbogacał i uzupełniał."}, {"id": "20171212-0900-PLENARY-7-pl_20171212-11-53-14_3", "src": "../cleaned/audio/20171212-0900-PLENARY-7-pl_20171212-11-53-14_3.flac", "dur": 19.26, "text": "Po raz kolejny też apelujemy do Komisji o zwiększenie środków docelowych w projekcie na rozwinięcie systemu szkoleń dla przedsiębiorców w zakresie przygotowania projektów, gdyż widzimy duże dysproporcje wydatkowania środków z tego funduszu między tzw. nową a zachodnią Europą."}, {"id": "20180117-0900-PLENARY-17-pl_20180117-18-11-20_2", "src": "../cleaned/audio/20180117-0900-PLENARY-17-pl_20180117-18-11-20_2.flac", "dur": 10.839, "text": "Uważam, że konieczne jest zniesienie barier w dostępie mło ogram dla bezrobotnej młodzieży."}, {"id": "20180314-0900-PLENARY-13-pl_20180314-15-47-02_1", "src": "../cleaned/audio/20180314-0900-PLENARY-13-pl_20180314-15-47-02_1.flac", "dur": 9.979, "text": "Cieszyła zgodność między Parlamentem a Komisją co do uznania bezpieczeństwa jako jednego z najważniejszych elementów właśnie tej perspektywy finansowej."}, {"id": "20180704-0900-PLENARY-pl_20180704-10-36-22_17", "src": "../cleaned/audio/20180704-0900-PLENARY-pl_20180704-10-36-22_17.flac", "dur": 9.72, "text": "Stąd też zgoda na zalew Europy tłumami muzułmańskich imigrantów, bo jeśli ludzie w Europie będą się bali, to łatwiej będzie odebrać im wolność i nimi rządzić."}, {"id": "20180704-0900-PLENARY-pl_20180704-11-34-24_15", "src": "../cleaned/audio/20180704-0900-PLENARY-pl_20180704-11-34-24_15.flac", "dur": 5.62, "text": "I wymiar sprawiedliwości należy zdecydowanie do kompetencji krajowych."}, {"id": "20180704-0900-PLENARY-pl_20180704-11-34-24_28", "src": "../cleaned/audio/20180704-0900-PLENARY-pl_20180704-11-34-24_28.flac", "dur": 4.84, "text": "Były głosy również szeroko odnoszące się do strefy euro."}, {"id": "20180704-0900-PLENARY-pl_20180704-11-34-24_38", "src": "../cleaned/audio/20180704-0900-PLENARY-pl_20180704-11-34-24_38.flac", "dur": 10.42, "text": "To jest bardzo ważna część agendy i przyszłość wspólnego rynku. Po drugie Unia bezpieczna. I dziękuję za te wszystkie głosy tutaj w bardzo wielu miejscach."}, {"id": "20180705-0900-PLENARY-4-pl_20180705-10-23-02_2", "src": "../cleaned/audio/20180705-0900-PLENARY-4-pl_20180705-10-23-02_2.flac", "dur": 4.98, "text": "akceptującym reguły jednolitego rynku, jak i europejski kręgosłup wartości."}, {"id": "20180705-0900-PLENARY-pl_20180705-12-58-19_4", "src": "../cleaned/audio/20180705-0900-PLENARY-pl_20180705-12-58-19_4.flac", "dur": 8.9, "text": "Trzeba koniecznie szybko pośpieszyć z konkretną dużą pomocą humanitarną i uruchomić te środki, o których mówił pan komisarz."}], VERDICTS = {"ok": "transcript matches the audio", "wrong_word": "wrong word(s)", "missing_word": "spoken word(s) missing from the transcript", "extra_word": "transcript has word(s) that are not spoken", "mismatch": "transcript belongs to other audio / mostly wrong", "unclear": "audio too unclear to judge"}, KEY = "aek-audit-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const list = document.getElementById("list");
document.getElementById("total").textContent = CLIPS.length;
const auditor = document.getElementById("auditor");
auditor.value = state._auditor || "";
auditor.oninput = () => { state._auditor = auditor.value; save(); };
function refresh() {
  let n = 0;
  CLIPS.forEach((c, i) => {
    const s = state[c.id] || {}, el = document.getElementById("c" + i);
    el.className = "clip" + (s.v ? (s.v === "ok" ? " done" : " err") : "");
    if (s.v) n++;
  });
  document.getElementById("count").textContent = n;
}
CLIPS.forEach((c, i) => {
  const d = document.createElement("div");
  d.id = "c" + i;
  const opts = ['<option value="">-- verdict --</option>'].concat(
    Object.entries(VERDICTS).map(([k, v]) => `<option value="${k}">${v}</option>`)).join("");
  d.innerHTML = `<div class="meta">${i + 1}. ${c.id} (${c.dur} s)</div>
    <audio controls preload="none" src="${c.src}"></audio>
    <div class="text"></div>
    <select>${opts}</select><input type="text" placeholder="note: what is wrong (optional)">`;
  d.querySelector(".text").textContent = c.text;
  const sel = d.querySelector("select"), note = d.querySelector("input");
  const s = state[c.id] || {};
  sel.value = s.v || ""; note.value = s.n || "";
  sel.onchange = () => { state[c.id] = {...(state[c.id] || {}), v: sel.value}; save(); refresh(); };
  note.oninput = () => { state[c.id] = {...(state[c.id] || {}), n: note.value}; save(); };
  list.appendChild(d);
});
refresh();
document.getElementById("dl").onclick = () => {
  const missing = CLIPS.filter(c => !(state[c.id] || {}).v).length;
  if (missing && !confirm(missing + " clips have no verdict yet. Download anyway?")) return;
  if (!auditor.value.trim()) { alert("Please enter your name first."); return; }
  const q = x => '"' + String(x || "").replace(/"/g, '""') + '"';
  const rows = ["utt_id,verdict,note,auditor"].concat(CLIPS.map(c => {
    const s = state[c.id] || {};
    return [c.id, s.v, s.n, auditor.value.trim()].map(q).join(",");
  }));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([rows.join("\n") + "\n"], {type: "text/csv"}));
  a.download = "audit_results.csv";
  a.click();
};
</script></body></html>
